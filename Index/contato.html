<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato - Enraizar</title>
    <link rel="stylesheet" href="../Layout/reset.css" />
    <link rel="stylesheet" href="../Layout/fonts.css" />
    <link rel="stylesheet" href="../Layout/contato.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  </head>
  <body>
    <div class="menu-suspenso">
      <button class="botao">☰</button>
      <div class="conteudo">
        <a href="../Index/inicial.html">PÁGINA INICIAL</a>
        <a href="../Index/quem-somos.html">QUEM SOMOS</a>
        <a href="../Index/quem-planta.html">QUEM PLANTA?</a>
        <a href="../Index/pedidos.html">PEDIDOS</a>
      </div>
    </div>

    <main class="container-contato">
      <header class="topo">
        <h4>FALE CONOSCO</h4>
        <p>ENVIE SUA MENSAGEM</p>
      </header>

      <section class="formulario-grid">
        <div class="info-contato">
          <h3>Onde nos encontrar</h3>
          <p>
            <i class="fas fa-map-marker-alt"></i> Camaquã - RS | Sítio Recanto
            da Lua
          </p>
          <p><i class="fab fa-whatsapp"></i> (53) 98122-9114</p>
          <p><i class="far fa-envelope"></i> contato.enraizar@gmail.com</p>
          <div class="redes-sociais">
            <a href="http://www.instagram.com/en.raiz.ar"><i class="fab fa-instagram"></i></a>
            <a href="https://www.youtube.com/embed/fAuV4xsHpCQ?si=G3-DHQAajwKuJjGr"><i class="fab fa-youtube"></i></a>
          </div>
        </div>

        <form action="#" method="post" class="form-contato">
          <fieldset> <!-- Lembrando: Fieldset agrupa os campos relacionados e desenha uma borda ao redor dos elementos agrupados -->
            <legend>Dados Pessoais</legend> <!-- legend coloca o titulo do bloco agrupado -->
            <div class="campo">
              <label for="nome">Nome Completo:</label>
              <input placeholder="Seu nome"/> <!-- placeholder faz com que apareça "seu nome" na caixa para digitar o nome -->
            </div>
            <div class="campo">
              <label for="email">E-mail:</label>
              <input placeholder="seuemail@exemplo.com" />
            </div>
            <div class="campo">
              <label for="telefone">Telefone:</label>
              <input placeholder="(51) 99999-9999" />
            </div>
          </fieldset>

          <fieldset>
            <legend>Preferências</legend>
            <div class="campo-radio">
              <span>Como prefere receber nosso contato?</span>
              <label
                ><input type="radio" name="contato" value="email" />
                E-mail</label
              >
              <label
                ><input type="radio" name="contato" value="whatsapp" />
                WhatsApp</label
              >
              <label>
              </div>
            <div class="campo">
              <label for="assunto">Assunto:</label>
              <select id="assunto" name="assunto">
                <option value="sugestao">Sugestão</option>
                <option value="reclamacao">Reclamação</option>
                <option value="colalboradora">Quero ser colaborador(a)</option>
                <option value="parceria">Quero ser fornecedor(a)</option>
                <option value="outro">Outro</option>
              </select>
            </div>
            <div class="campo">
              <label for="mensagem">Mensagem:</label>
              <textarea
                id="mensagem"
                name="mensagem"
                rows="5"
                placeholder="Digite sua mensagem aqui..."
              ></textarea>
            </div>
          </fieldset>
          <button type="submit" class="botao-enviar">ENVIAR MENSAGEM</button>
        </form>
      </section>
    </main>
  </body>
</html>
