<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato - Enraizar</title>
    <link rel="stylesheet" href="contato.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="menu-suspenso">
      <button class="botao">☰</button>
      <div class="conteudo">
        <a href="../Inicial/inicial.html">PÁGINA INICIAL</a>
        <a href="../Quem-somos/quem-somos.html">QUEM SOMOS</a>
        <a href="../Quem-planta/produtoras.html">QUEM PLANTA?</a>
        <a href="../Pedidos/pedidos.html">PEDIDOS</a>
      </div>
    </div>

    <main class="container-contato">
      <header class="topo">
        <h4>FALE CONOSCO</h4>
        <p>ENVIE SUA MENSAGEM</p>
      </header>

      <section class="formulario-grid">
        <!-- Coluna da Esquerda: Informações de Contato -->
        <div class="info-contato">
          <h3><i class="fas fa-paper-plane"></i> Onde nos encontrar</h3>
          <p>
            <i class="fas fa-map-marker-alt"></i> Camaquã - RS | Sítio Recanto
            da Lua
          </p>
          <p><i class="fab fa-whatsapp"></i> (51) 99999-9999</p>
          <p><i class="far fa-envelope"></i> contato@enraizar.org</p>
          <div class="redes-sociais">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
          </div>
        </div>

        <!-- Coluna da Direita: Formulário -->
        <form action="#" method="post" class="form-contato">
          <fieldset>
            <legend>Dados Pessoais</legend>
            <div class="campo">
              <label for="nome">Nome Completo:</label>
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Seu nome"
                required
              />
            </div>
            <div class="campo">
              <label for="email">E-mail:</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="seuemail@exemplo.com"
                required
              />
            </div>
            <div class="campo">
              <label for="telefone">Telefone:</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(51) 99999-9999"
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Preferências</legend>
            <div class="campo-radio">
              <span>Como prefere receber nosso contato?</span>
              <label
                ><input type="radio" name="contato" value="email" />
                E-mail</label
              >
              <label
                ><input type="radio" name="contato" value="whatsapp" />
                WhatsApp</label
              >
              <label>
            </div>
            <div class="campo">
              <label for="assunto">Assunto:</label>
              <select id="assunto" name="assunto">
                <option value="sugestao">Sugestão</option>
                <option value="reclamacao">Reclamação</option>
                <option value="colalboradora">Quero ser colaborador(a)</option>
                <option value="parceria">Quero ser fornecedor(a)</option>
                <option value="outro">Outro</option>
              </select>
            </div>
            <div class="campo">
              <label for="mensagem">Mensagem:</label>
              <textarea
                id="mensagem"
                name="mensagem"
                rows="5"
                placeholder="Digite sua mensagem aqui..."
              ></textarea>
            </div>
          </fieldset>
          <button type="submit" class="btn-enviar">ENVIAR MENSAGEM</button>
        </form>
      </section>
    </main>
  </body>
</html>
